[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-move-trainer-experiments"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["chess==1.11.2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
