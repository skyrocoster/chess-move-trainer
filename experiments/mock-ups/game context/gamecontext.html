<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Context</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board-dark:#141019;
    --board-panel:#1d1723;
    --board-panel-raised:#241d2c;
    --ivory:#efe6d6;
    --ivory-dim:#a89e8e;
    --gold:#c9a227;
    --gold-dim:#8a742a;
    --oxblood:#a8433a;
    --sage:#7c9a6b;
    --hair:rgba(239,230,214,0.09);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(201,162,39,0.07), transparent 60%),
      var(--board-dark);
    color:var(--ivory);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    padding:56px 20px 80px;
    display:flex;
    justify-content:center;
  }
  .sheet{ width:100%; max-width:560px; }

  /* ---------- collapsible panel ---------- */
  details.panel{
    background:var(--board-panel);
    border:1px solid var(--hair);
    border-radius:var(--radius);
    overflow:hidden;
  }
  details.panel > summary{
    list-style:none;
    cursor:pointer;
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:10px;
    user-select:none;
  }
  details.panel > summary::-webkit-details-marker{ display:none; }
  details.panel > summary:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:-2px;
  }
  .chevron{
    color:var(--gold);
    font-size:11px;
    transition:transform 0.18s ease;
    flex-shrink:0;
  }
  details.panel[open] .chevron{ transform:rotate(90deg); }
  summary h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15.5px;
    margin:0;
    color:var(--gold);
    letter-spacing:0.01em;
  }

  .panel-body{
    padding:2px 20px 22px;
  }

  .field{ margin-bottom:18px; }
  .field:last-child{ margin-bottom:0; }
  .field-label{
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ivory-dim);
    margin-bottom:6px;
  }

  /* Ply: value + tiny progress dots */
  .ply-value{
    font-size:14px;
    color:var(--ivory);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .ply-dots{
    display:flex;
    gap:4px;
  }
  .ply-dots span{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--gold);
  }

  /* Source link */
  .source-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    color:var(--ivory);
    text-decoration:none;
    border-bottom:1px solid var(--gold-dim);
    padding-bottom:1px;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  .source-link:hover{ color:var(--gold); border-color:var(--gold); }
  .source-link:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .source-link svg{ width:12px; height:12px; flex-shrink:0; }

  /* ==========================================================
     SAN MOVE COMPONENT — same extractable unit used for Last move.
     Scoped under .san-move / .san-move__*; reads theme tokens with
     fallbacks, no dependency on the rest of this page.
     ========================================================== */
  .san-move{
    --san-bg: var(--board-panel-raised, #241d2c);
    --san-border: var(--hair, rgba(239,230,214,0.09));
    --san-fg: var(--ivory, #efe6d6);
    --san-dim: var(--ivory-dim, #a89e8e);
    --san-accent: var(--gold, #c9a227);

    background:var(--san-bg);
    border:1px solid var(--san-border);
    border-radius:8px;
    padding:12px 14px;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .san-move__notation{
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    font-weight:500;
    color:var(--san-fg);
    letter-spacing:0.01em;
  }
  .san-move__notation .num{
    color:var(--san-accent);
    margin-right:3px;
  }
  /* ========================== /SAN COMPONENT ========================== */

</style>
</head>
<body>
<div class="sheet">

  <details class="panel" open>
    <summary>
      <span class="chevron">&#9656;</span>
      <h1>Game context</h1>
    </summary>

    <div class="panel-body">

      <div class="field">
        <div class="field-label">Ply</div>
        <div class="ply-value">
          Ply 3 of 3
          <span class="ply-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </div>
      </div>

      <div class="field">
        <div class="field-label">Last move</div>
        <!-- ===================== SAN COMPONENT ===================== -->
        <div class="san-move">
          <div class="san-move__notation"><span class="num">3.</span>Nf3</div>
        </div>
        <!-- =================== /SAN COMPONENT ======================= -->
      </div>

      <div class="field">
        <div class="field-label">Source</div>
        <a class="source-link" href="#" target="_blank" rel="noopener noreferrer">
          Chess.com game
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </a>
      </div>

    </div>
  </details>

</div>
</body>
</html>
