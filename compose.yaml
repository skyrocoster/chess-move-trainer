name: chess-move-trainer

x-worker-common: &worker-common
  build:
    context: .
    dockerfile: backend/Dockerfile
  init: true
  working_dir: /workspace
  environment:
    PYTHONUNBUFFERED: "1"
  volumes:
    - type: bind
      source: .
      target: /workspace
    - chess-database:/workspace/data/database
  restart: "no"
  stop_grace_period: 30s

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - python
      - -m
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "5666"
      - --reload
      - --reload-dir
      - /workspace/backend
      - --reload-dir
      - /workspace/src
    init: true
    working_dir: /workspace
    # The Docker socket is owned by root:root with mode 660 on Docker Desktop,
    # so the non-root `app` user must join that group to read container state.
    group_add:
      - "0"
    environment:
      CHESS_REBUILT_DATABASE_PATH: data/database/chess.db
      PYTHONUNBUFFERED: "1"
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - type: bind
        source: .
        target: /workspace
      - chess-database:/workspace/data/database
      # Read-only Docker socket so the health endpoint can report whether the
      # analysis worker containers are running. The backend only issues GET
      # requests against /containers/json; it never controls the containers.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    ports:
      - "127.0.0.1:5666:5666"
    restart: "no"
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5666/api/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command:
      - npm
      - --workspace
      - frontend
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
    init: true
    working_dir: /workspace
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - type: bind
        source: ./frontend
        target: /workspace/frontend
      - frontend-node-modules:/workspace/frontend/node_modules
    ports:
      - "127.0.0.1:8444:8444"
    restart: "no"
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8444').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  storybook:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    pull_policy: build
    command:
      - npm
      - --workspace
      - frontend
      - run
      - storybook
      - --
      - --host
      - 0.0.0.0
    init: true
    working_dir: /workspace
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - type: bind
        source: ./frontend
        target: /workspace/frontend
      - storybook-node-modules:/workspace/frontend/node_modules
    ports:
      - "127.0.0.1:6006:6006"
    restart: "no"
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6006').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  datasette:
    image: datasetteproject/datasette
    command:
      - datasette
      - serve
      - /data/chess.db
      - --host
      - 0.0.0.0
      - --port
      - "8666"
    init: true
    # Mounted read-write on purpose: SQLite needs the -wal/-shm sidecars for
    # locking while workers write. Datasette only issues SELECT statements, so
    # it does not change data. A :ro mount plus --immutable produces bogus
    # "database disk image is malformed" errors on this live database.
    volumes:
      - chess-database:/data
    ports:
      - "127.0.0.1:8666:8666"
    restart: "no"
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8666/-/databases.json', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s

  worker:
    <<: *worker-common
    command:
      - python
      - -m
      - chess_move_trainer.database
      - stockfish
      - worker
      - --database
      - data/database/chess.db
      - --executable
      - /usr/local/bin/stockfish
      - --poll-interval
      - "5"

  worker-six:
    <<: *worker-common
    profiles:
      - worker-six
    command:
      - python
      - -m
      - chess_move_trainer.database
      - stockfish
      - worker
      - --database
      - data/database/chess.db
      - --executable
      - /usr/local/bin/stockfish
      - --lock-timeout
      - "30"
      - --poll-interval
      - "5"
      - --parallel

volumes:
  chess-database:
  frontend-node-modules:
  storybook-node-modules:
