# Authoritative test-domain catalogue for Chess Move Trainer.
#
# Every test source matches exactly one domain or subdomain below. `sg test list`
# fails when a file matches none or several. Layer is derived from the file
# location and runner, never from this file. Case identity for pytest and
# Playwright is discovered from the frameworks; Vitest files are selectable file
# groups.
#
# Fixture profiles: none, temp-db (throwaway SQLite database), live-services
# (needs the running development services), browser (Playwright) and real-db
# (opt-in tests that read the live database).
#
# Rules and placement examples: tests/catalog/README.md.

[meta]
title = "Chess Move Trainer test catalogue"
version = 1

# ---------------------------------------------------------------------------
# Application surface
# ---------------------------------------------------------------------------

[domains.health]
title = "Health endpoint and status page"
owner = "backend/app/features/health/"
purpose = "GET /api/health, its database and Docker probes, the contract export and the status page."
paths = [
  "backend/tests/features/health/*",
  "frontend/src/features/status/*",
  "tests/e2e/status-page.spec.ts",
]
tags = ["health", "status"]
default_fixture = "temp-db"

[domains.health.subdomains.client]
paths = ["frontend/src/api/healthClient.test.ts"]
default_fixture = "live-services"

[domains.api-client]
title = "Generated API client"
owner = "frontend/src/api/"
purpose = "The generated client surface, query keys and invalidation rules."
paths = [
  "frontend/src/api/generatedSurface.test.ts",
  "frontend/src/api/noAdoption.test.ts",
  "frontend/src/api/queryInvalidation.test.ts",
  "frontend/src/api/queryKeys.test.ts",
]
tags = ["api", "client"]
default_fixture = "none"

