[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-move-trainer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio==4.14.2",
    "cachetools==7.2.0",
    "chess==1.11.2",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "httpx2==2.13.0",
    "numpy==2.3.3",
    "pandas==2.3.2",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "SQLAlchemy==2.0.54",
    "scipy==1.16.2",
    "statsmodels==0.14.5",
    "typer==0.27.2",
    "uvicorn[standard]==0.53.0",
]

[project.scripts]
sg = "tools.dev.cli.main:main"

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["Scratch/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["backend*", "chess_move_trainer*", "tools*"]

[tool.setuptools.package-data]
"chess_move_trainer.database" = ["*.sql"]
"tools.dev.screenshots" = ["driver.mjs"]
